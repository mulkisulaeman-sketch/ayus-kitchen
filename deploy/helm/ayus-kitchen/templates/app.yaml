apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ayus-kitchen.fullname" . }}
data:
  NODE_ENV: {{ .Values.env.NODE_ENV | quote }}
  APP_VERSION: {{ .Values.env.APP_VERSION | quote }}
  LOG_LEVEL: {{ .Values.env.LOG_LEVEL | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ayus-kitchen.fullname" . }}-db
type: Opaque
stringData:
  DATABASE_URL: {{ printf "postgres://%s:%s@%s-postgres:%v/%s" .Values.database.user .Values.database.password (include "ayus-kitchen.fullname" .) .Values.database.port .Values.database.name | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ayus-kitchen.fullname" . }}
  labels:
    {{- include "ayus-kitchen.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy: {type: RollingUpdate, rollingUpdate: {maxUnavailable: 0, maxSurge: 1}}
  selector:
    matchLabels: {{- include "ayus-kitchen.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "ayus-kitchen.selectorLabels" . | nindent 8 }}
    spec:
      securityContext: {seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports: [{name: http, containerPort: 3000}]
          envFrom:
            - configMapRef: {name: {{ include "ayus-kitchen.fullname" . }}}
            - secretRef: {name: {{ include "ayus-kitchen.fullname" . }}-db}
          securityContext:
            runAsNonRoot: true
            runAsUser: 100
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          livenessProbe: {httpGet: {path: /health, port: http}, initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}, periodSeconds: {{ .Values.probes.liveness.periodSeconds }}}
          readinessProbe: {httpGet: {path: /health, port: http}, initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}, periodSeconds: {{ .Values.probes.readiness.periodSeconds }}}
          resources: {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes: [{name: tmp, emptyDir: {}}]
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ayus-kitchen.fullname" . }}
spec:
  type: {{ .Values.service.type }}
  selector: {{- include "ayus-kitchen.selectorLabels" . | nindent 4 }}
  ports: [{name: http, port: 3000, targetPort: http}]
{{- if .Values.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "ayus-kitchen.fullname" . }}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: {{ include "ayus-kitchen.fullname" . }}}
  minReplicas: {{ .Values.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: {{ .Values.autoscaling.targetCPUUtilizationPercentage }}}}
{{- end }}
